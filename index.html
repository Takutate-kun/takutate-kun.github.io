<script>
  // =========================================================
  // ↓↓↓ 次の1行だけ書き換えてください ↓↓↓
  // ' ' の中を、Google Apps Script の「ウェブアプリのURL」（…/exec で終わるもの）にする

  const API_URL = 'https://script.google.com/macros/s/AKfycbxFBJQxZJoTUfFvf8ur4b22lO0YbOAYVY1xj0pidnRwzMhKf7JbNJEUioRpw9-KzOUyuA/exec';
  const LIFF_ID = '2012021643-IdHGgAz7';
</script>
<style>
  :root{
    --bg:#eef1ec; --card:#ffffff; --ink:#1d2420; --muted:#5f6b64; --line:#d6ddd7;
    --felt:#1e5a43; --felt-ink:#f3f0e4; --tile:#f6f1e1; --tile-edge:#c9bf9f;
    --join:#1f7a4f; --dayof:#a86a12; --wish:#7a4fa8; --later:#2f5f9e; --no:#c8372d;
    --join-bg:#e3f2ea; --dayof-bg:#fbefd9; --wish-bg:#efe6f8; --later-bg:#e3ebf7; --no-bg:#f9e2df;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#121614; --card:#1b211e; --ink:#e7ece8; --muted:#9aa69f; --line:#2f3934;
      --felt:#18473a; --felt-ink:#f0ecdd; --tile:#ece5cf; --tile-edge:#a99f80;
      --join:#55c48c; --dayof:#e0a94e; --wish:#b58be0; --later:#7ba6e6; --no:#ea6a5e;
      --join-bg:#1e3a2c; --dayof-bg:#3a2e17; --wish-bg:#2e2340; --later-bg:#1d2b40; --no-bg:#3d201d;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;font-size:15px;line-height:1.6}
  .wrap{max-width:520px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right))}
  .head{background:var(--felt);color:var(--felt-ink);border-radius:16px;padding:14px 16px}
  .head .no{display:inline-block;background:var(--tile);color:#1d2420;border-radius:4px;padding:0 8px;font-weight:700;font-size:13px;margin-right:6px}
  .head h1{margin:6px 0 2px;font-size:19px;line-height:1.35}
  .head .sub{font-size:13px;opacity:.9}
  .phase{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;background:rgba(255,255,255,.18)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:14px}
  .verdict{font-size:18px;font-weight:700}
  .mine{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .mine b{font-size:16px}
  .pill{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px}
  .p-join{background:var(--join-bg);color:var(--join)} .p-dayof{background:var(--dayof-bg);color:var(--dayof)}
  .p-wish{background:var(--wish-bg);color:var(--wish)} .p-later{background:var(--later-bg);color:var(--later)}
  .p-no{background:var(--no-bg);color:var(--no)} .p-none{background:var(--bg);color:var(--muted)}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .btns button{font:inherit;font-size:16px;font-weight:700;padding:14px 8px;border-radius:12px;border:2px solid currentColor;background:transparent;cursor:pointer;line-height:1.3}
  .btns button small{display:block;font-size:11px;font-weight:400;opacity:.85}
  .btns button[data-st="join"]{color:var(--join)} .btns button[data-st="dayof"]{color:var(--dayof)}
  .btns button[data-st="later"]{color:var(--later)} .btns button[data-st="no"]{color:var(--no)}
  .btns button.on{color:var(--card)!important}
  .btns button.on[data-st="join"]{background:var(--join);border-color:var(--join)}
  .btns button.on[data-st="dayof"]{background:var(--dayof);border-color:var(--dayof)}
  .btns button.on[data-st="later"]{background:var(--later);border-color:var(--later)}
  .btns button.on[data-st="no"]{background:var(--no);border-color:var(--no)}
  .btns button:disabled{opacity:.45}
  .note{font-size:13px;color:var(--muted);margin:10px 0 0}
  .toast{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--join-bg);color:var(--join);font-weight:700}
  .toast.err{background:var(--no-bg);color:var(--no)}
  .lists{display:flex;flex-direction:column;gap:8px}
  .row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline}
  .row .names{font-size:14px;min-width:0;word-break:break-word}
  h2{font-size:13px;color:var(--muted);margin:0 0 8px;letter-spacing:.05em}
  .center{text-align:center;color:var(--muted);padding:40px 0}
  .admin{font-size:13px;color:var(--muted)}
  .evs{display:flex;flex-direction:column;gap:8px}
  .ev{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;
      background:var(--bg);border:2px solid transparent;border-radius:12px;padding:10px 12px;cursor:pointer}
  .ev.cur{border-color:var(--felt);background:var(--card)}
  .ev .t{font-weight:700;font-size:15px;min-width:0}
  .ev .t .n{display:inline-block;background:var(--felt);color:var(--felt-ink);border-radius:4px;padding:0 6px;font-size:12px;margin-right:6px}
  .ev .s{grid-column:1 / -1;font-size:12px;color:var(--muted)}
  .adm{border:2px solid var(--later)}
  .adm h2{color:var(--later)}
  details.help{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 16px;margin-top:14px}
  details.help summary{cursor:pointer;font-weight:700;padding:14px 0;list-style-position:inside}
  details.help .body{padding:0 0 14px;font-size:14px}
  details.help h3{font-size:13px;color:var(--muted);margin:14px 0 6px;letter-spacing:.05em}
  details.help ul{margin:0;padding-left:1.2em}
  details.help li{margin:4px 0}
  .cmds{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:baseline}
  .cmds code{font-family:inherit;font-weight:700;background:var(--bg);border-radius:6px;padding:1px 6px;white-space:nowrap}
  .cmds span{min-width:0}
  .stick{position:fixed;top:0;left:0;right:0;z-index:10;background:var(--felt);color:var(--felt-ink);box-shadow:0 2px 8px rgba(0,0,0,.18);
         padding:calc(8px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left))}
  .stick .in{max-width:520px;margin:0 auto;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:14px}
  .stick .n{display:inline-block;background:var(--tile);color:#1d2420;border-radius:4px;padding:0 8px;font-weight:700;font-size:13px}
  .stick b{font-size:15px}
  .target{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;background:var(--later-bg);border-radius:10px;padding:10px 12px;margin:0 0 10px}
  .target .n{display:inline-block;background:var(--later);color:var(--card);border-radius:4px;padding:0 8px;font-weight:700;font-size:13px}
  .target b{font-size:16px}
  .target span.s{font-size:12px;color:var(--muted);width:100%}
  .mem-h{font-size:13px;font-weight:700;color:var(--later);margin:14px 0 0}
  .warn{background:var(--dayof-bg);color:var(--dayof);font-weight:700;border-radius:10px;padding:8px 12px;margin:0 0 10px;font-size:14px}
  .acts{display:flex;flex-direction:column;gap:8px}
  .acts button{font:inherit;font-weight:700;font-size:15px;padding:12px;border-radius:12px;border:2px solid var(--later);background:transparent;color:var(--later);cursor:pointer;text-align:left}
  .acts button small{display:block;font-weight:400;font-size:11px;opacity:.85}
  .mem{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;margin-top:12px}
  .mem .nm{font-size:14px;min-width:0;word-break:break-word}
  .mem select{font:inherit;font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center">読み込み中…</div></div>

<script>
const ST = ['join','dayof','later','no'];
const BTN = { join:['参加',''], dayof:['当日補欠OK','直前の連絡でも行ける'], later:['2日前に回答','締切までに連絡'], no:['不参加',''] };
let state = null, eventId = null, groupKey = null, busy = false, admMsg = null;
const $app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fail(msg){ $app.innerHTML = '<div class="card"><b>' + esc(msg) + '</b></div>'; }

async function api(body){
  body.idToken = liff.getIDToken();
  body.eventId = eventId;
  if (!eventId && groupKey) body.groupKey = groupKey;
  const res = await fetch(API_URL, { method:'POST', body: JSON.stringify(body) });  // text/plain で送る（事前確認なし）
  return res.json();
}

function evList(d){
  const list = d.others || [];
  if (!list.length) return '';
  let h = '<div class="card"><h2>このグループの日程（押すと切り替わります）</h2><div class="evs">';
  list.forEach(x => {
    h += '<button class="ev' + (x.id === d.event.id ? ' cur' : '') + '" data-id="' + esc(x.id) + '">'
       + '<span class="t"><span class="n">日程' + x.no + '</span>' + esc(x.when) + '</span>'
       + '<span class="pill p-' + (x.status || 'none') + '">' + esc(x.label) + '</span>'
       + '<span class="s">' + esc(x.place || '場所未定') + '・' + esc(x.phaseLabel) + '・' + esc(x.verdict) + '</span></button>';
  });
  return h + '</div></div>';
}

let headObs = null;
function watchHead(){
  const head = $app.querySelector('.head'), stick = document.getElementById('stick');
  if (!head || !stick || !('IntersectionObserver' in window)) return;
  if (headObs) headObs.disconnect();
  headObs = new IntersectionObserver(es => { stick.hidden = es[0].isIntersecting; });
  headObs.observe(head);
}

async function switchTo(id){
  if (busy || id === eventId) return;
  busy = true; eventId = id; admMsg = null;
  try { history.replaceState(null, '', '?e=' + encodeURIComponent(id) + (groupKey ? '&g=' + encodeURIComponent(groupKey) : '')); } catch (e) {}
  $app.style.opacity = .5;
  try {
    const r = await api({ api:'get' });
    busy = false; $app.style.opacity = 1;
    if (!r.ok) return fail(r.error);
    state = r; render(); window.scrollTo(0, 0);
  } catch (err) { busy = false; $app.style.opacity = 1; render('読み込めませんでした。もう一度押してください。', true); }
}

function render(toast, isErr){
  const d = state, e = d.event, me = d.me;
  const lockLater = e.phase !== 'open';
  let h = '';
  h += '<div class="head"><span class="no">日程' + e.no + '</span><span class="sub">' + esc(e.place || '場所未定') + '</span>'
     + '<h1>' + esc(e.when) + '</h1>'
     + '<div class="sub">' + (e.deadline ? '回答の締切：' + esc(e.deadline) : '') + '</div>'
     + '<span class="phase">' + esc(e.phaseLabel) + (e.late ? '・直前ルール中' : '') + '</span></div>';
  if ((d.others || []).some(x => x.id !== e.id)) h += evList(d);   // ほかにも日程があるときだけ一覧を出す

  h += '<div class="card"><h2>あなたの回答</h2><div class="mine"><b>' + esc(me.name) + 'さん</b>'
     + '<span class="pill p-' + (me.status || 'none') + '">' + esc(me.label) + '</span></div>';
  h += '<div class="btns">' + ST.map(st => {
         const dis = (st === 'later' && lockLater) || busy;
         return '<button data-st="' + st + '" class="' + (me.status === st ? 'on' : '') + '"' + (dis ? ' disabled' : '') + '>'
              + BTN[st][0] + (BTN[st][1] ? '<small>' + BTN[st][1] + '</small>' : '') + '</button>';
       }).join('') + '</div>';
  if (toast) h += '<div class="toast' + (isErr ? ' err' : '') + '">' + esc(toast) + '</div>';
  if (e.phase === 'closed') h += '<p class="note">人数発表が済んでいるため、変更するとグループにお知らせが流れます。</p>';
  else if (e.late && !me.admin) h += '<p class="note">開始直前のため、「参加」は参加希望として受け付け、主催者・管理者が確定します。確定の連絡が来るまでは会場に向かわないでください。</p>';
  else h += '<p class="note">回答しても、グループにはメッセージは流れません。</p>';
  h += '</div>';

  h += '<div class="card"><h2>いまの状況</h2><div class="verdict">' + esc(d.verdict) + '</div></div>';

  // 名前を表示しない設定のグループでは、主催者・管理者以外には人数だけを出す
  const hideNames = d.namesHidden && !me.admin;
  h += '<div class="card"><h2>' + (hideNames ? '回答した人数' : '回答した人') + '</h2><div class="lists">';
  ['join','dayof','wish','later','no'].forEach(st => {
    const names = d.lists[st] || [];
    const n = d.counts ? (d.counts[st] || 0) : names.length;
    if (!n && (st === 'wish' || st === 'later')) return;
    const shown = st === 'dayof' ? names.map((x,i) => '①②③④⑤⑥⑦⑧⑨⑩'[i] + x) : names;
    h += '<div class="row"><span class="pill p-' + st + '">' + esc(d.labels[st]) + ' ' + n + (hideNames ? '人' : '') + '</span>'
       + (hideNames ? '' : '<span class="names">' + (shown.length ? shown.map(esc).join('、') : '—') + '</span>') + '</div>';
  });
  h += '</div>';
  if (hideNames) h += '<p class="note">このグループでは、誰が参加するかの名前は主催者・管理者だけに表示されます。</p>';
  else if (d.namesHidden) h += '<p class="note">このグループは名前を表示しない設定です。この名前は主催者・管理者のあなたにだけ見えています。</p>';
  h += '</div>';

  if (me.admin && d.adminView) h += adminMenu(d);
  h += helpBox(me.admin, d.namesHidden);
  // スクロールして見出しが隠れたら、上に対象の日程を固定表示する
  h += '<div class="stick" id="stick" hidden><div class="in"><span class="n">日程' + e.no + '</span><b>' + esc(e.when) + '</b>' + (e.place ? '<span>' + esc(e.place) + '</span>' : '') + '</div></div>';
  $app.innerHTML = h;
  watchHead();
  $app.querySelectorAll('.btns button').forEach(b => b.addEventListener('click', () => answer(b.dataset.st)));
  $app.querySelectorAll('.ev').forEach(b => b.addEventListener('click', () => switchTo(b.dataset.id)));
  $app.querySelectorAll('.acts button').forEach(b => b.addEventListener('click', () => adminAct(b.dataset.act)));
  $app.querySelectorAll('.mem select').forEach(sel => sel.addEventListener('change', () => adminSet(sel.dataset.id, sel.value, sel)));
}

// ---- 使い方（見ている本人にだけ表示。グループには何も流れない） ----
function helpBox(admin, hidden){
  const row = (c, t) => '<code>' + c + '</code><span>' + t + '</span>';
  let h = '<details class="help"><summary>使い方・送る言葉の一覧</summary><div class="body">';
  h += '<p class="note" style="margin-top:0">この欄はあなたにだけ見えています。開いてもグループには何も流れません。</p>';
  h += '<h3>回答のしかた</h3><ul>'
     + '<li>この画面のボタンで回答します。何度でも変えられ、グループには流れません。</li>'
     + '<li>「当日補欠OK」は、席が空いたら直前の連絡でも行ける人です。</li>'
     + '<li>「2日前に回答」は、締切（開始の2日前）までに決める人です。</li>'
     + '<li>人数発表のあとに回答を変えると、グループにお知らせが出ます。</li>'
     + '<li>開始3時間前からの「参加」は参加希望になります。確定の連絡が来るまで、会場には向かわないでください。</li></ul>';
  h += '<h3>誰でも送れる言葉</h3><div class="cmds">'
     + row('集計', '日程ごとの人数を小さなカードで出す（全員に見えます）')
     + row('回答リンク', 'このグループの回答画面のリンクを出す')
     + row('最終メンバー', hidden ? '参加が確定した人数を出す（名前は出ません）' : '参加が確定した人の一覧を出す')
     + row('管理者一覧', '主催者と管理者を確認する') + '</div>';
  if (admin) {
    h += '<h3>主催者・管理者が送れる言葉</h3><div class="cmds">'
       + row('募集 10/25 19:00 雀荘', '日程を作って募集を始める')
       + row('締切', '回答を締め切る（約12時間の猶予あり）')
       + row('人数発表', '返事のない人を不参加にして卓の数を発表')
       + row('リマインド', '「2日前に回答」の人に催促')
       + row('募集再開', '締切・人数発表を取り消す')
       + row('変更 @名前 参加', 'メンションした人の回答を変える')
       + row('直前ルール 2時間前', '参加希望に切り替わる時刻を変える')
       + row('管理者追加 @名前', '管理者を増やす（主催者だけ）')
       + row('名前表示 オン／オフ', 'カードや最終メンバーに名前を出すか（いまは' + (hidden ? 'オフ：人数だけ' : 'オン') + '）') + '</div>'
       + '<p class="note">日程が2つ以上あるときは「締切2」のように番号を付けます。付けなければ、どの日程かをボタンで聞かれます。グループに流したくない操作は、上の管理者メニューからできます。</p>';
  }
  return h + '</div></details>';
}

// ---- 管理者メニュー（主催者・管理者にだけ表示） ----
const ACTS = {
  close:   ['締切', '回答を締め切る', '締め切ったことがグループに表示されます'],
  remind:  ['催促', '「2日前に回答」の人に催促する', 'その人たちにメンションした催促がグループに表示されます'],
  announce:['人数発表', '人数を発表する', '返事のない人は不参加になり、結果がグループに表示されます'],
  final:   ['最終メンバー', '最終メンバーを出す', '確定した参加者の一覧がグループに表示されます']
};
function adminMenu(d){
  const e = d.event, v = d.adminView;
  let h = '<div class="card adm"><h2>管理者メニュー（主催者・管理者にだけ見えています）</h2>';
  const others = (d.others || []).some(x => x.id !== e.id);
  h += '<div class="target"><span class="n">日程' + e.no + '</span><b>' + esc(e.when) + '</b>' + (e.place ? '<span>' + esc(e.place) + '</span>' : '')
     + '<span class="s">このメニューの操作は、すべて「日程' + e.no + '」が対象です。' + (others ? '別の日程は、上の「このグループの日程」で切り替えてください。' : '') + '</span></div>';
  if (v.overdue) h += '<p class="warn">締切（' + esc(e.deadline) + '）を過ぎています。' + (v.later ? '「2日前に回答」が' + v.later + '人います。' : '') + '</p>';
  const acts = [];
  if (e.phase === 'open') acts.push('close');
  if (e.phase !== 'closed' && v.later) acts.push('remind');
  if (e.phase !== 'closed') acts.push('announce');
  acts.push('final');
  if (d.namesHidden) ACTS.final[2] = '確定した人数がグループに表示されます（名前は出ません）';
  else ACTS.final[2] = '確定した参加者の一覧がグループに表示されます';
  h += '<div class="acts">' + acts.map(a => '<button data-act="' + a + '">日程' + e.no + '：' + ACTS[a][1] + (a === 'remind' ? '（' + v.later + '人）' : '') + '<small>' + ACTS[a][2] + '</small></button>').join('') + '</div>';
  if (admMsg) h += '<div class="toast' + (admMsg.err ? ' err' : '') + '">' + esc(admMsg.text) + '</div>';
  h += '<p class="note">下の一覧で回答を変えても、グループには流れません' + (d.namesHidden ? '。変えた相手にも通知は届かないので、必要なら個別に伝えてください。' : '（人数発表のあとに参加者が増減する変更だけ、グループにお知らせが出ます）。') + '</p>';
  const opts = [['', '未回答'], ['join', '参加'], ['dayof', '当日補欠OK'], ['later', '2日前に回答'], ['no', '不参加']];
  h += '<p class="mem-h">日程' + e.no + '（' + esc(e.when) + '）のメンバーの回答</p>';
  h += '<div class="mem">' + v.members.map(m => {
    const cur = m.status === 'wish' ? 'wish' : m.status;
    const list = opts.filter(o => o[0] !== 'later' || e.phase === 'open' || cur === 'later');
    if (cur === 'wish') list.splice(1, 0, ['wish', '参加希望（未確定）']);
    return '<span class="nm">' + esc(m.name) + '</span><select data-id="' + esc(m.id) + '" aria-label="' + esc(m.name) + 'さんの回答"' + (busy ? ' disabled' : '') + '>'
      + list.map(o => '<option value="' + o[0] + '"' + (o[0] === cur ? ' selected' : '') + (o[0] === '' || o[0] === 'wish' ? ' disabled' : '') + '>' + o[1] + '</option>').join('') + '</select>';
  }).join('') + '</div>';
  if (!v.members.length) h += '<p class="note">まだ回答した人がいません。</p>';
  return h + '</div>';
}

async function sendToGroup(text){
  if (!liff.isInClient()) { render('この操作はLINEアプリの中から行ってください。グループに「' + text + '」と送っても同じことができます。', true); return false; }
  await liff.sendMessages([{ type:'text', text }]);
  liff.closeWindow();
  return true;
}

async function adminAct(act){
  if (busy) return;
  const e = state.event;
  if (!window.confirm('日程' + e.no + '（' + e.when + '）：' + ACTS[act][1] + '\n' + ACTS[act][2] + '。よろしいですか？')) return;
  try { await sendToGroup('【卓立てくん】日程' + e.no + '：' + ACTS[act][0] + ' #' + e.id); }
  catch (err) { render('送信できませんでした。もう一度お試しください。', true); }
}

async function adminSet(id, st, sel){
  if (busy) return;
  const msg = (t, err) => { admMsg = { text: t, err: !!err }; render(); };
  busy = true; msg('変更しています…');
  try {
    const r = await api({ api:'set', target:id, status:st });
    busy = false;
    if (!r.ok) { msg(r.error, true); return; }
    if (r.viaChat) {
      if (!window.confirm('人数発表のあとの変更なので、グループにお知らせが出ます。よろしいですか？')) { msg('変更をやめました。'); return; }
      await sendToGroup(r.message);
      return;
    }
    state = r; msg(r.done);
  } catch (err) { busy = false; msg('変更できませんでした。もう一度お試しください。', true); }
}

async function answer(st){
  if (busy) return;
  busy = true; render('送信中…');
  try {
    const r = await api({ api:'answer', status: st });
    if (!r.ok) { busy = false; render(r.error, true); return; }
    if (r.viaChat) {
      // みんなに関係する回答は、本人の発言としてグループに送る（ボットが返事をする）
      if (!liff.isInClient()) { busy = false; render('この回答はLINEアプリの中から送る必要があります。グループに「' + r.message + '」と送ってください。', true); return; }
      await liff.sendMessages([{ type:'text', text: r.message }]);
      liff.closeWindow();
      return;
    }
    state = r; busy = false; render(r.done);
  } catch (err) {
    busy = false; render('送信できませんでした。通信状態を確認して、もう一度押してください。', true);
  }
}

(async function main(){
  try {
    await liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true });
    const q = new URLSearchParams(location.search);
    eventId = q.get('e'); groupKey = q.get('g');
    if (!eventId && !groupKey) return fail('日程が指定されていません。グループの日程カードの「回答する」か、アナウンスのリンクから開いてください。');
    const r = await api({ api:'get' });
    if (!r.ok) return fail(r.error);
    if (r.empty) return fail('いま募集中の日程はありません。主催者・管理者が募集を始めると、ここに出ます。');
    eventId = r.event.id;
    state = r; render();
  } catch (err) {
    fail('読み込みに失敗しました。画面を閉じて、もう一度開いてください。（' + (err && err.message ? err.message : err) + '）');
  }
})();
</script>
